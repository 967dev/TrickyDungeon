<!-- =========================================================================
     СТЕНД КАРТЫ ГОРОДА

     Он подключает НАСТОЯЩИЕ файлы карты — css/11-map.css и js/13-map.js — и
     кормит их выдуманными данными. Раньше здесь лежала своя копия всей карты, и
     это был вопрос времени, когда копия и игра разойдутся: ровно этот класс
     ошибок в проекте уже стрелял (одно правило в двух местах, разошлись, нашли
     через неделю). Теперь реализация одна.

     Зачем стенд нужен вообще. В игре есть ОДИН акт, поэтому открытие района —
     самое дорогое, что карта умеет, — в игре не запускается: следующий район
     пуст, и туман с него честно не сходит. Проверять это можно только на
     данных, до которых игра ещё не доросла. Стенд их и выдаёт: дописывает
     районам 2–6 имена и арт, а этапам — принадлежность акту.

     Игровые глобали заменены заглушками ниже. Список короткий нарочно: если он
     начнёт разрастаться, это сигнал, что карта тянет на себя то, чего ей знать
     не надо.
     ========================================================================= -->

<style>
/* Свои правила идут БЕЗ @layer, поэтому перебивают слои игры — стенду это
   разрешено. */

*{box-sizing:border-box}
/* Экран отдаёт полосу внизу пульту. С запасом: пульт переносится на две
   строки на узком окне и наезжает на нижний район. */

/* Пульт стенда. В игре его не будет — он тут, чтобы можно было ПОКРУТИТЬ
   прогресс и увидеть, как отступает туман. Это главное, что стенд показывает:
   не картинку, а поведение. */
#пульт{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0d0d14;

#пульт b{font-family:var(--disp);font-style:italic;color:var(--yel);font-size:12px}
#пульт input[type=range]{width:170px;accent-color:var(--yel)}
#пульт .знач{color:var(--yel);min-width:44px}
#пульт .разд{width:1px;height:20px;background:#2c2c38}
#пульт label{display:flex;align-items:center;gap:5px;color:#8a8a9e;cursor:pointer}
#пульт input[type=checkbox]{accent-color:var(--yel)}
#пульт button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:#16161f;color:#cfccdd;border:2px solid #2c2c38;padding:5px 9px;cursor:pointer}
#пульт button:hover{border-color:var(--yel);color:var(--yel)}
#пульт button.главная{background:var(--yel);color:#0a0a0e;border-color:#000;
  font-family:var(--disp);font-style:italic}
#пульт button.главная:hover{color:#0a0a0e}

<div id="пульт">

<script>
/* ================= заглушки игры =================
   Всё, что карта берёт снаружи. Заглушки нарочно тупые: стенд проверяет карту,
   а не игру, и любая логика здесь была бы второй реализацией. */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
/* theEnd сразу 1: финал доступного содержимого — экран игры, у стенда его нет,
   и вставать он тут не должен. */
const S  = {done:{}, stage:99, hero:'m', story:1, mapAct:1, theEnd:1};
const save = () => {};
let CUR = 'stages';
const sfx = {ui(){}};
const CHATS = {};
const chatSeen = () => true;
const openChat = () => {};
const STORIES = {m:{title:'СЦЕНА АКТА', intro:''}};
const curStory = () => STORIES.m;
const vnLoad = (_a,_b,к) => к && к();
const startStory = к => к && к();
const go = () => {};
const toast = () => {};
/* Единственная заглушка с поведением: показать, что дверь в бой сработала. */
const enterStage = i => {
  const п = $('#stSub');
  п.textContent = 'стенд: пошли бы в бой «' + STAGES[i].n + '» (этап ' + i + ')';
};
</script>

<script src="js/02-data.js"></script>

<script>
/* ================= выдуманное содержимое =================
   Игра знает один акт. Стенд дописывает остальные пять — иначе не посмотреть ни
   как туман отходит по всем шести, ни как играется открытие.
   Имена боёв — из акта 1: свои напишет автор, и придумывать за него тут нечего.
   Делать это НАДО ДО js/13-map.js: он читает АКТЫ и STAGES при отрисовке, но
   пусть данные будут целыми с самого начала. */
(() => {
  const образцы = STAGES.filter(st => st.акт === 1 && !st.tutorial);
  const арты = ['art/story/boy1.webp','art/cards/c13.webp','art/story/scene1.webp',
                'art/story/boy3.webp','art/story/scene2.webp'];
  const имена = [['БАР','«ЧЁРНАЯ ЗВЕЗДА»'],['УЛИЦЫ ГОРОДА',''],['РЫНОК','СЕРАЯ ЗОНА'],
                 ['ВОКЗАЛ','ТРАНЗИТ'],['ВЕРХНИЙ ЯРУС','ТУДА НЕ ХОДЯТ']];
  АКТЫ.forEach((а, i) => {
    if (i === 0) return;
    а.имя  = имена[i-1][0];
    а.под  = имена[i-1][1];
    а.титул = 'АКТ ' + а.акт + ' · ' + имена[i-1][0];
    а.арт  = арты[i-1];
    for (const о of образцы) STAGES.push(Object.assign({}, о, {акт:а.акт}));
  });
  /* DIFF индексируется этапом, а этапов стало вшестеро больше. */
  while (DIFF.length < STAGES.length) DIFF.push('стенд');
  /* Граница выпуска поднимается до всех районов: в игре она стоит на втором
     акте, и с ней стенд не смог бы показать ни одного открытия. */
  ФИНАЛ = АКТЫ.length;
})();
</script>

<script src="js/13-map.js"></script>

<script>
/* ================= пульт =================
   Два ползунка нарочно РАЗВЯЗАНЫ: туман ходит по районам, а не по боям, и
   смотреть на него удобнее, дёргая районы напрямую.
   Прогресс кладём в S.done, а не в МАП: карта должна считать состояние сама,
   иначе стенд проверял бы не её. */
const прР = $('#пРайоны'), прЗ = $('#пПрогресс'), жд = $('#пЖдать');
const боиПоАктам = n => боиАкта(n).filter(i => !STAGES[i].tutorial);

function разложить(){
  S.done = {};
  const актов = +прР.value, зачищено = +прЗ.value;
  /* Все районы до текущего — зачищены целиком. */
  for (let a = 1; a < актов; a++) for (const i of боиПоАктам(a)) S.done[i] = 1;
  /* В текущем — сколько указано ползунком. */
  боиПоАктам(актов).slice(0, зачищено).forEach(i => S.done[i] = 1);
  /* stage держим впереди всего: запертые строки в табло стенду не нужны. */
  S.mapAct = актов;
  $('#пРайоныЗнач').textContent = актов + ' / ' + АКТЫ.length;
  $('#пПрогрессЗнач').textContent = зачищено + ' / ' + боиПоАктам(актов).length;
}
function обновить(){
  МАП.ждать = жд.checked;
  разложить();
  renderStages();
}
прР.oninput = обновить;
прЗ.oninput = обновить;
жд.onchange = обновить;

/* Открытие играем ЧЕРЕЗ настоящий путь: доводим прогресс до конца текущего
   района и просим карту догнать. Так стенд проверяет ту же дорогу, по которой
   игрок придёт с последнего боя, а не отдельную кнопку. */
$('#кОткрыть').onclick = () => {
  const актов = +прР.value;
  if (актов >= АКТЫ.length) return;
  for (const i of боиПоАктам(актов)) S.done[i] = 1;
  S.mapAct = актов;                       /* показ ещё на прежнем районе */
  прР.value = актов + 1; прЗ.value = 0;
  $('#пРайоныЗнач').textContent = (актов+1) + ' / ' + АКТЫ.length;
  $('#пПрогрессЗнач').textContent = '0 / ' + боиПоАктам(актов+1).length;
  renderStages();
};
$('#кСброс').onclick = () => {
  /* Сброс обязан вернуть и следы открытия: иначе следующий показ стартует с
     уже затухшим слоем и растворение не видно. */
  мПоказ++;
  for (const с of [$('#mapFog'), $('#mapFog2')]){
    с.classList.remove('gone','on');
    с.style.transformOrigin = '';
    мПорыв(с, 1);
  }
  мАктивный = $('#mapFog'); мСпящий = $('#mapFog2');
  мАктивный.classList.add('on');
  $('#mapTrace').innerHTML = '';
  прР.value = 1; прЗ.value = 0; жд.checked = true;
  $('#stSub').textContent = 'стенд';
  обновить();
};

обновить();
</script>
