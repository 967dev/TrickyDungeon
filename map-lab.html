<!doctype html>
<meta charset="utf-8">
<title>Стенд: карта города</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Стенд НЕ в игре. Он подключает её же стили, чтобы язык совпадал: палитра,
     шрифты, плоские тени. Свои правила ниже идут без @layer, поэтому
     перебивают слои игры — так и задумано, стенду это разрешено. -->
<link rel="stylesheet" href="css/01-base.css">

<style>
/* ================= стенд ================= */
body{margin:0;background:var(--bg,#0a0a0f);color:#e9e9f0;overflow:hidden;
  font-family:'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}

/* Пульт стенда. В игре его не будет — он тут, чтобы можно было ПОКРУТИТЬ
   прогресс и увидеть, как отступает туман. Это главное, что стенд должен
   показать: не картинку, а поведение. */
#пульт{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0d0d14;
  border-top:2px solid #2c2c38;font-family:var(--mono);font-size:11px}
#пульт b{font-family:var(--disp);font-style:italic;color:var(--yel);font-size:12px}
#пульт input[type=range]{width:170px;accent-color:var(--yel)}
#пульт .знач{color:var(--yel);min-width:44px}
#пульт .разд{width:1px;height:20px;background:#2c2c38}
#пульт label{display:flex;align-items:center;gap:5px;color:#8a8a9e;cursor:pointer}
#пульт input[type=checkbox]{accent-color:var(--yel)}
#пульт button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:#16161f;color:#cfccdd;border:2px solid #2c2c38;padding:5px 9px;cursor:pointer}
#пульт button:hover{border-color:var(--yel);color:var(--yel)}
#пульт button.главная{background:var(--yel);color:#0a0a0e;border-color:#000;
  font-family:var(--disp);font-style:italic}
#пульт button.главная:hover{color:#0a0a0e}

/* ================= сцена ================= */
/* Вся карта ЦЕЛИКОМ влезает в экран — ничего не таскается пальцем. Причина не
   в лени: в Telegram свайп уже занят закрытием приложения (мы его глушим), а в
   бою пальцем тащат карты. Третья таскаемая поверхность — это баги, которые
   видно только на живом телефоне. */
#сцена{position:fixed;inset:0;bottom:44px;overflow:hidden}
/* На телефоне город не влезает в один экран без превращения районов в марки.
   Поэтому там он ВЫТЯНУТ и листается вертикально — обычной прокруткой, а не
   таскаемой картой: один жест вместо двух, и он у пальца уже привычный. */
@media (max-width:700px){
  #сцена{overflow-y:auto;overflow-x:hidden}
  #карта{height:150vh}
}

#шапка{position:absolute;left:0;right:0;top:0;z-index:6;padding:10px 14px 0;
  pointer-events:none}
#шапка .над{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:#6a6a80}
#шапка h1{font-family:var(--disp);font-style:italic;font-size:26px;margin:2px 0 0;
  color:var(--yel);text-shadow:3px 3px 0 #000;letter-spacing:.01em}
#шапка .под{font-family:var(--mono);font-size:10px;color:#8a8a9e;margin-top:3px}

#карта{position:absolute;inset:0;background-color:#08080c;
  transform-origin:22% 50%;
  transition:transform .5s cubic-bezier(.2,.9,.3,1)}

/* ================= город под районами =================
   Настоящая карта улиц, но НАРИСОВАННАЯ градиентами, а не картинкой. Три
   причины: весит ноль, не разъезжается по стилю от партии к партии (наша
   главная беда с артом) и её видно ровно настолько, насколько нужно — район
   должен быть героем, а город фоном.
   Слоя два и они повёрнуты по-разному: одна сетка, выровненная по экрану,
   читается как таблица, а не как город. */
#город,#город2{position:absolute;inset:-25%;z-index:0;pointer-events:none}
#город{transform:rotate(-3.5deg);
  background-image:
    /* проспекты */
    repeating-linear-gradient(90deg,rgba(155,195,255,.13) 0 2px,transparent 2px 172px),
    repeating-linear-gradient(0deg, rgba(155,195,255,.12) 0 2px,transparent 2px 208px),
    /* улицы */
    repeating-linear-gradient(90deg,rgba(155,195,255,.055) 0 1px,transparent 1px 43px),
    repeating-linear-gradient(0deg, rgba(155,195,255,.05) 0 1px,transparent 1px 52px)}
#город2{transform:rotate(24deg);
  background-image:
    /* пара косых магистралей — они и ломают ощущение сетки */
    repeating-linear-gradient(90deg,rgba(155,195,255,.085) 0 2px,transparent 2px 430px),
    repeating-linear-gradient(0deg, rgba(155,195,255,.06) 0 1px,transparent 1px 96px)}

/* Кварталы и свечение центра: без них улицы выглядят чертежом, а не местом. */
#кварталы{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse 30% 22% at 26% 30%,rgba(90,130,210,.10),transparent 70%),
    radial-gradient(ellipse 26% 20% at 76% 62%,rgba(210,90,170,.07),transparent 70%),
    radial-gradient(ellipse 40% 30% at 52% 88%,rgba(90,130,210,.06),transparent 70%)}
/* Края города уходят в темноту — карта не должна обрываться рамкой экрана. */
#винь{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 40%,rgba(8,8,12,.85) 100%)}
body.открыт #карта{transform:translateX(-16%) scale(.9)}

/* ================= район ================= */
.район{position:absolute;z-index:2;width:var(--ш);aspect-ratio:1.35/1;
  transform:translate(-50%,-50%);cursor:pointer;
  transition:filter .35s,opacity .35s}
.район>.жила{position:absolute;inset:0}

/* Рваный контур рисуется CSS, а не запекается в картинку: тогда он одинаков у
   всех районов сам собой, а свечение активного достаётся бесплатно. Обводку
   даёт слой ПОД картинкой с тем же clip-path и чуть больше по размеру —
   обвести clip-path напрямую нельзя. */
.район .кайма{position:absolute;inset:-4px;clip-path:var(--блоб);background:#3a3a4c}
.район .кадр{position:absolute;inset:0;clip-path:var(--блоб);overflow:hidden;background:#000}
/* Район без арта — пустая площадка: расчищено, а смотреть пока нечего. Так
   видно, что туман отошёл, и видно, что за ним ничего не приготовлено. */
.район.пусто .кадр{background:
  repeating-linear-gradient(-45deg,#101018 0 9px,#0b0b12 9px 20px)}
.район.пусто .имя{color:#5a5a6e}
.район .кадр img{width:100%;height:100%;object-fit:cover;display:block}
/* Низ кадра гасим — на нём лежат имя и номер акта. */
.район .кадр::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.1) 40%,rgba(0,0,0,.86) 100%)}

.район .бирка{position:absolute;left:8%;top:7%;z-index:3;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#9a9ab0}
.район .имя{position:absolute;left:6%;right:6%;bottom:9%;z-index:3;text-align:center;
  font-family:var(--disp);font-style:italic;font-size:clamp(11px,1.5vw,17px);color:#fff;
  text-shadow:2px 2px 0 #000,0 0 12px rgba(0,0,0,.9)}
.район .подимя{position:absolute;left:6%;right:6%;bottom:3%;z-index:3;text-align:center;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:#8a8a9e}

/* --- открыт --- */
.район.открыт .кайма{background:var(--yel);
  box-shadow:0 0 0 1px #000,0 0 22px rgba(255,213,46,.35),0 0 60px rgba(255,213,46,.14)}
.район.открыт .имя{color:var(--yel)}
.район.открыт:hover{filter:brightness(1.12)}

/* --- пройден --- */
.район.пройден .кайма{background:#5c6b3a}
.район.пройден .кадр img{filter:saturate(.5) brightness(.7)}

/* --- следующий: силуэт, имени нет ---
   Один шаг вперёд ВСЕГДА виден. Без него игрок не знает, что дальше вообще
   что-то есть, и карта читается как тупик. */
.район.след{cursor:default}
.район.след .кайма{background:#23232e}
.район.след .кадр img{filter:brightness(.42) contrast(.8) grayscale(.7)}
.район.след .имя,.район.след .подимя,.район.след .бирка{display:none}
.район.след .замок{display:block}

/* --- в тумане: видно, что место есть, но не видно КАКОЕ ---
   Именно это отличает туман от восьми замков: замки читаются как «игру не
   доделали», туман — как «я туда ещё не дошёл». И картинка такому району не
   нужна вовсе: арт понадобится ровно тогда, когда появится акт. */
/* ================= туман =================
   Туман лежит НА ВСЕЙ КАРТЕ одним слоем и открывает прогалы там, где игрок
   был. Раньше он был у каждого района свой — и тогда по тёмным пятнам можно
   было посчитать, сколько районов впереди, и увидеть их форму. То есть
   «неизвестно» превращалось в «известно, но заперто».
   Теперь неизведанное — сплошная муть: ни числа районов, ни их очертаний,
   ни даже улиц под ними.

   Слой стоит ПОВЕРХ районов и дорог (z-index 3): дорога, уходящая в туман,
   должна в нём и растворяться, а не обрываться на границе. */
/* Оба слоя живут постоянно, с непрерывно ползущими клубами. Виден тот, у кого
   метка .виден; уходящий поднимается наверх меткой .сходит. Ничего не
   пересоздаётся — иначе анимация дыма прыгает в начало. */
#туман,#туман2{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0}
#туман.виден,#туман2.виден{opacity:1}
/* Второй слой — КОПИЯ прежнего тумана, которая гаснет поверх нового. Так
   расчистка получается плавной, и при этом ни одна маска не пересчитывается
   на кадрах: меняется только прозрачность готового слоя. Анимировать саму
   маску нельзя — она пересобирается каждый кадр и вешает страницу. */
#туман.сходит,#туман2.сходит{z-index:4}
/* Рассеивание, а не выключение. Одной прозрачности мало: слой, ровно гаснущий
   целиком, читается как выключенный свет. Пелена должна РАСХОДИТЬСЯ — поэтому
   вместе с прозрачностью она чуть разъезжается от нового района (начало
   отсчёта ставится в него из кода), и её собственные клубы всё это время
   продолжают ползти.
   Кривая нарочно неровная: две трети времени муть держится и только редеет, а
   уходит в ноль на последней трети. Ровное затухание глаз читает как шкалу. */
#туман.сходит,#туман2.сходит{animation:рассеивается 3.1s cubic-bezier(.25,0,.45,1) forwards}
/* Порыв: на время рассеивания клубы копии идут ВТРОЕ быстрее и уходят в
   сторону. Без этого пелена честно редеет, но стоит на месте — а стоящий на
   месте дым не рассеивается, он выцветает. */
.сходит .клубы1{animation:клубы1 11s linear forwards}
.сходит .клубы2{animation:клубы2 14s linear forwards}
.сходит .клубы3{animation:клубы3 17s linear forwards}
@keyframes рассеивается{
  0%  {opacity:1;   transform:scale(1)}
  30% {opacity:.82; transform:scale(1.035)}
  62% {opacity:.44; transform:scale(1.075)}
  85% {opacity:.14; transform:scale(1.105)}
  100%{opacity:0;   transform:scale(1.13)}}

/* Трасса — сплошная линия, которая ПРОЧЕРЧИВАЕТСЯ от района к району. Бегущий
   пунктир так не показать: узор и прочерчивание живут в одном свойстве
   (stroke-dasharray), и вместе они не уживаются. Поэтому сперва тянется
   трасса, а на её месте потом остаётся обычный пунктир. */
#трасса path{fill:none;stroke:var(--yel);stroke-width:4;stroke-linecap:round;
  opacity:.95}
/* Проявление — ТОЛЬКО прозрачность. Со scale район дёргался: у .район базовый
   transform это translate(-50%,-50%), и анимация его подменяла, а на выходе
   отдавала назад — на стыке и получался рывок. Масштабировать позиционируемый
   элемент вообще незачем: район должен проступить, а не выпрыгнуть. */
.район.проявился{animation:проявление 1.4s ease-out}
@keyframes проявление{
  0%  {opacity:0}
  100%{opacity:1}}
/* Клубы ползут навстречу друг другу с разной скоростью: неподвижная муть
   читается как недоделка, ползущая — как погода. Анимируем transform на
   группах, без фильтров — фильтры на такой площади дорого стоят на телефоне. */
/* Три пелены одной и той же текстуры, разного размера и скорости. Одна копия
   выдала бы себя формой, три перекрывающиеся дают клубы без узнаваемого
   рисунка. Текстура тёмно-серая на ЧЁРНОМ, и рисуется она в режиме screen:
   чёрное тогда не кладётся вовсе, поэтому копии стыкуются без швов — по краям
   у каждой чистый ноль. */
#туман .пелена{mix-blend-mode:screen}
#туман .клубы1{animation:клубы1 34s ease-in-out infinite alternate}
#туман .клубы2{animation:клубы2 47s ease-in-out infinite alternate-reverse}
#туман .клубы3{animation:клубы3 61s linear infinite}
@keyframes клубы1{
  0%  {transform:translate(-3%,-2%) scale(1)}
  55% {transform:translate(3%,3%)   scale(1.09)}
  100%{transform:translate(4%,-1%)  scale(1.04)}}
@keyframes клубы2{
  0%  {transform:translate(4%,2%)    scale(1.06)}
  45% {transform:translate(-3%,-3%)  scale(1)}
  100%{transform:translate(-2%,4%)   scale(1.1)}}
/* Третья идёт в одну сторону без возврата: две пелены, ходящие туда-обратно,
   вместе дают заметный ритм «вдох-выдох». Третья его ломает. */
@keyframes клубы3{
  0%  {transform:translate(-6%,2%)  scale(1.12)}
  100%{transform:translate(6%,-2%)  scale(1.12)}}

/* Район, до которого не дошли, не рисуем вовсе: под туманом его всё равно не
   видно, а не отрисованного точно не подсмотришь. */
.район.туман{display:none}

.район .замок{display:none;position:absolute;left:50%;top:50%;z-index:3;
  transform:translate(-50%,-50%);width:17%;opacity:.42}
.район .замок svg{width:100%;fill:none;stroke:#8a8a9e;stroke-width:2}

/* ================= путь ================= */
/* Пунктир бежит от района к району — тот же приём, что у дуги прицела в бою. */
#путь,#трасса{position:absolute;inset:0;z-index:1;pointer-events:none}
/* Трасса открытия — в ОТДЕЛЬНОМ слое. Лежала внутри #путь, а тот при
   перерисовке дорог перезаписывается целиком: трасса исчезала в один кадр
   ровно тогда, когда открывался район. Это и дёргало. */
#трасса{z-index:2}
#путь path{fill:none;stroke:var(--yel);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:4 11;opacity:.9;animation:бег 1.1s linear infinite}
#путь path.глухой{stroke:#454559;opacity:.9;animation:none}
@keyframes бег{to{stroke-dashoffset:-15}}
#путь circle{fill:var(--yel);stroke:#0a0a0f;stroke-width:2}
#путь circle.глухой{fill:#454559}

/* ================= панель квестов ================= */
/* Список — тот, что в игре уже работает: номер, имя, значок чата, замок.
   Здесь он ВЫЕЗЖАЕТ, а не переделывается. */
#панель{position:absolute;right:0;top:0;bottom:0;width:min(430px,44vw);z-index:8;
  background:#0d0d14;border-left:3px solid var(--yel);
  box-shadow:-14px 0 40px rgba(0,0,0,.6);
  transform:translateX(101%);transition:transform .5s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column}
body.открыт #панель{transform:translateX(0)}
#панель .гол{padding:14px 16px 10px;border-bottom:2px solid #2c2c38;position:relative}
#панель .гол .акт{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#8a8a9e}
#панель .гол h2{font-family:var(--disp);font-style:italic;font-size:19px;margin:3px 0 0;
  color:var(--yel);text-shadow:2px 2px 0 #000}
#панель .гол .счёт{font-family:var(--mono);font-size:10px;color:#8a8a9e;margin-top:4px}
#панель .закр{position:absolute;right:12px;top:12px;width:30px;height:30px;
  background:#16161f;border:2px solid #2c2c38;color:#cfccdd;font-size:15px;cursor:pointer}
#панель .закр:hover{border-color:var(--red);color:var(--red)}
#панель .список{flex:1;overflow:auto;padding:8px}

.квест{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:6px;
  background:rgba(255,255,255,.04);border-left:3px solid #262633;
  font-family:var(--mono);font-size:11px}
.квест .ном{font-family:var(--disp);font-size:13px;color:var(--yel);width:18px;flex:none}
.квест .имя{flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.квест .хп{color:#8a8a9e;flex:none;font-size:9.5px}
.квест .тел{flex:none;width:20px;height:20px;display:grid;place-items:center;
  border:1px solid #3a3a4c;color:var(--cyn);font-size:10px}
.квест .бой{flex:none;font-family:var(--disp);font-size:10px;background:var(--yel);
  color:#0a0a0e;border:2px solid #000;padding:3px 8px;cursor:pointer}
.квест.готов{border-left-color:#3dff8a}
.квест.готов .имя{color:#8fbf9f}
.квест.готов .бой{background:#2a2a36;color:#8a8a9e;border-color:#0a0a0f}
.квест.заперт{opacity:.45;border-left-color:#262633}
.квест.заперт .бой{display:none}
.квест.заперт .тел{display:none}
.квест.сейчас{border-left-color:var(--yel);background:rgba(255,213,46,.08)}

/* ================= телефон ================= */
/* Мобильный формат — первый по важности: цель это Telegram на ~375px.
   Панель тут не «сбоку», а НАКРЫВАЕТ карту целиком: 44% ширины от 375px это
   165px, в них список не живёт. */
@media (max-width:700px){
  #шапка h1{font-size:20px}
  #панель{width:100%;border-left:0;border-top:3px solid var(--yel)}
  body.открыт #карта{transform:none}
  .район .имя{font-size:11px}
}
</style>

<div id="сцена">
  <div id="карта">
    <div id="город"></div>
    <div id="город2"></div>
    <div id="кварталы"></div>
    <div id="винь"></div>
    <svg id="путь"></svg>
    <svg id="трасса"></svg>
    <svg id="туман"></svg>
    <svg id="туман2"></svg>
  </div>

  <div id="шапка">
    <div class="над">КАРТА ГОРОДА</div>
    <h1>ТВОЙ РАЙОН</h1>
    <div class="под" id="подзаг">акт 1 из 8 · зачищено 0/10</div>
  </div>

  <div id="панель">
    <div class="гол">
      <div class="акт" id="пАкт">АКТ 1</div>

<div id="пульт">
  <b>СТЕНД</b>
  <span>районов открыто:</span>

  <span class="разд"></span>

  <button id="кСброс">сброс</button>

<script>
/* ================= данные =================
   Район = акт. Добавить район — это СТРОЧКА здесь плюс одна картинка; ни
   перерисовки карты, ни правки вёрстки. Координаты в процентах, поэтому карта
   одинаково собирается на любом экране.
   x,y — широкий экран; mx,my — телефон (там раскладка вытянута вниз). */
/* Шесть районов. У трёх есть содержимое, у трёх — пока нет, и это НЕ
   заглушка «скоро»: за такой район не придумано, что там будет. Поэтому он
   лежит в тумане, а не под замком — замок обещает дверь, туман не обещает
   ничего.
   Появится содержимое — впиши имя и арт, и район сам войдёт в путь. */
const РАЙОНЫ = [
  {акт:1, имя:'ДОМ',          под:'ТВОЯ БАЗА',       боёв:10, арт:'art/story/scene4.webp', x:26, y:29, ш:'30%', блоб:1},
  {акт:2, имя:'БАР',          под:'«ЧЁРНАЯ ЗВЕЗДА»', боёв:10, арт:'art/story/boy1.webp',   x:71, y:25, ш:'27%', блоб:2},
  {акт:3, имя:'УЛИЦЫ ГОРОДА', под:'',                боёв:10, арт:'art/cards/c13.webp',    x:79, y:57, ш:'25%', блоб:3},
  {акт:4, боёв:10, x:47, y:60, ш:'24%', блоб:2},
  {акт:5, боёв:10, x:16, y:63, ш:'24%', блоб:1},
  {акт:6, боёв:10, x:45, y:87, ш:'25%', блоб:3},
];
/* Район готов к показу, только если за ним что-то есть. Отсюда и правило:
   туман сходит с района, а не с номера. */
const есть = р => !!(р.имя && р.арт);
const ждатьСодержимое = () => {
  const г = document.getElementById('пЖдать');
  return !г || г.checked;
};

/* Телефон: та же карта, но вытянутая вниз — на 375px район шириной в четверть
   экрана нечитаем. Раскладка ОТДЕЛЬНАЯ, а не пересчёт первой: на узком экране
   город идёт змейкой, и это осознанная композиция, а не сжатие. */
const УЗКО = {
  1:{x:32,y:13,ш:'54%'}, 2:{x:69,y:28,ш:'49%'}, 3:{x:31,y:44,ш:'49%'},
  4:{x:69,y:60,ш:'47%'}, 5:{x:31,y:76,ш:'47%'}, 6:{x:68,y:91,ш:'46%'},
};
const место = р => узкий() ? Object.assign({}, р, УЗКО[р.акт]) : р;

/* Три рваных контура, по кругу: одинаковые районы читались бы как плитки. */
const БЛОБЫ = {
  1:'polygon(7% 14%,20% 3%,49% 7%,76% 1%,95% 13%,100% 40%,95% 71%,76% 95%,45% 100%,17% 93%,2% 68%,0% 36%)',
  2:'polygon(4% 20%,24% 6%,54% 2%,80% 8%,98% 26%,100% 55%,88% 82%,62% 97%,32% 99%,10% 86%,1% 58%,2% 34%)',
  3:'polygon(9% 8%,38% 2%,66% 5%,92% 2%,100% 30%,96% 60%,99% 84%,70% 93%,40% 99%,14% 90%,0% 62%,4% 30%)',
};

/* Настоящие имена боёв акта 1 — те, что в игре сейчас. Ничего не
   переименовываю: имена боёв следующих актов пишет автор. */
const АКТ1 = [
  {n:'xX_Mr_Anon_Xx',  hp:18}, {n:'Gold_Swag_2k',    hp:22},
  {n:'Новички-стримеры',hp:24},{n:'Мама_ангелочка',  hp:26},
  {n:'Тишина Второго Рода',hp:30},{n:'Ая Курона',    hp:32},
  {n:'@НГЕЛ В КЕД@Х',  hp:34}, {n:'Хозяин Провала',  hp:36},
  {n:'Диспетчер',      hp:38}, {n:'БАМ-БАМ',         hp:42},
];

/* ================= состояние стенда ================= */
const С = {актов:1, зачищено:0};   /* актов — сколько РАЙОНОВ открыто */
let выбран = null;

/* ================= отрисовка ================= */
const карта = document.getElementById('карта');
const путь  = document.getElementById('путь');
const трасса = document.getElementById('трасса');
const туман = document.getElementById('туман');
const туман2 = document.getElementById('туман2');
/* Активный показывает текущее состояние, спящий ждёт с нулевой прозрачностью.
   При открытии они меняются ролями. */
let активный = туман, спящий = туман2;

function узкий(){ return innerWidth <= 700 }

/* Состояние района при заданном числе открытых. Вынесено, чтобы можно было
   спросить «а как было до открытия» — на этом держится копия прежнего тумана. */
function состояниеПри(р, актов){
  if (ждатьСодержимое() && !есть(р)) return 'туман';
  if (р.акт < актов) return 'пройден';
  if (р.акт === актов) return 'открыт';
  if (р.акт === актов + 1) return 'след';
  return 'туман';
}
function состояние(р){
  /* Правило игры: за районом ничего нет — он в тумане, сколько бы игрок ни
     прошёл. Показать силуэт места, которого не существует, значит соврать.
     В стенде это правило можно снять галочкой — иначе не посмотреть, как
     туман отходит по всем шести. */
  if (ждатьСодержимое() && !есть(р)) return 'туман';
  if (р.акт < С.актов) return 'пройден';
  if (р.акт === С.актов) return 'открыт';
  if (р.акт === С.актов + 1) return 'след';   /* один шаг вперёд виден всегда */
  return 'туман';
}

function нарисовать(){
  карта.querySelectorAll('.район').forEach(n => n.remove());
  for (const р of РАЙОНЫ){
    const сост = состояние(р);
    const el = document.createElement('div');
    el.className = 'район ' + сост + (есть(р) ? '' : ' пусто');
    el.style.setProperty('--блоб', БЛОБЫ[р.блоб]);
    const м = место(р);
    el.style.setProperty('--ш', м.ш);
    el.style.left = м.x + '%';
    el.style.top  = м.y + '%';
    el.innerHTML =
      '<div class="кайма"></div>' +
      '<div class="кадр">' +
        (р.арт ? '<img src="' + р.арт + '" alt="" draggable="false">' : '') + '</div>' +
      '<div class="бирка">АКТ ' + р.акт + '</div>' +
      '<div class="имя">' + (р.имя || '—') + '</div>' +
      (р.под ? '<div class="подимя">' + р.под + '</div>' : '') +
      '<div class="замок"><svg viewBox="0 0 24 24">' +
        '<rect x="5" y="11" width="14" height="10"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>';
    if (сост === 'открыт' || сост === 'пройден') el.onclick = () => открыть(р);
    карта.appendChild(el);
  }
  нарисоватьПуть();
  обновитьПрогалы(активный, С.актов);
  const п = document.getElementById('подзаг');
  п.textContent = 'акт ' + С.актов + ' из ' + РАЙОНЫ.length +
    ' · зачищено ' + С.зачищено + '/' + РАЙОНЫ[С.актов-1].боёв;
}

/* Путь ведёт только туда, куда уже можно: за открытым районом он гаснет и
   обрывается в тумане. Это и есть «дальше есть куда идти», без обещаний. */
/* Концы дороги — от КРАЯ к краю, а не от центра к центру: дорога, выходящая
   из середины района, читается как воткнутая в него булавка.
   Район считаем эллипсом по его коробке: контур рваный, но вписанный эллипс от
   него почти не отличается, а точка выхода тогда берётся формулой, без обхода
   полигона.
   Вынесено отдельной функцией потому, что этим же путём идёт трасса открытия:
   ей нельзя разойтись с пунктиром ни на пиксель. */
function концы(ма, мб, W, H){
  const ax = ма.x/100*W, ay = ма.y/100*H;
  const bx = мб.x/100*W, by = мб.y/100*H;
  const кр = (м, dx, dy) => {
    const пол = м.ш.replace('%','')/100*W/2;      /* полуось по ширине */
    const a2 = пол, b2 = пол/1.35;                /* и по высоте: коробка 1.35:1 */
    const t = 1/Math.hypot(dx/a2, dy/b2);
    return [dx*t, dy*t];
  };
  const dx = bx-ax, dy = by-ay;
  const [ox,oy] = кр(ма, dx, dy);
  const [ix,iy] = кр(мб, -dx, -dy);
  const зазор = 7;                                /* чтобы пунктир не лип к обводке */
  const дл = Math.hypot(dx,dy) || 1;
  return [ax + ox + dx/дл*зазор, ay + oy + dy/дл*зазор,
          bx + ix - dx/дл*зазор, by + iy - dy/дл*зазор];
}
/* Небольшой изгиб в сторону: прямая между районами читается как линейка, а не
   как дорога. */
function дуга(нx, нy, кx, кy){
  const cx = (нx+кx)/2 + (кy-нy)*0.14, cy = (нy+кy)/2 + (нx-кx)*0.14;
  return 'M' + нx.toFixed(1) + ' ' + нy.toFixed(1) +
         ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + кx.toFixed(1) + ' ' + кy.toFixed(1);
}

/* Дороги ПЕРЕИСПОЛЬЗУЮТСЯ. Раньше здесь перезаписывался innerHTML, а вместе с
   узлами пересоздавались и их анимации: бегущий пунктир прыгал в начало в тот
   же кадр, что открывался район. Теперь узлы живут, меняются только атрибуты —
   и бег не рвётся. */
function нарисоватьПуть(){
  /* Считаем в пикселях коробки карты, а не в процентах: у процентного viewBox
     с preserveAspectRatio="none" штрих и точки расплющивает по одной оси, и
     аккуратный пунктир превращается в кляксы. */
  const W = карта.clientWidth, H = карта.clientHeight;
  путь.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const НС = 'http://www.w3.org/2000/svg';
  let n = 0;
  for (let i = 0; i < РАЙОНЫ.length - 1; i++){
    const a = РАЙОНЫ[i], b = РАЙОНЫ[i+1];
    if (b.акт > С.актов + 1) break;               /* дальше тумана путь не ведёт */
    const [нx,нy,кx,кy] = концы(место(a), место(b), W, H);
    const глухой = b.акт > С.актов;
    let л = путь.children[n*2], т = путь.children[n*2+1];
    if (!л){ л = document.createElementNS(НС,'path'); л.setAttribute('fill','none'); путь.appendChild(л) }
    if (!т){ т = document.createElementNS(НС,'circle'); путь.appendChild(т) }
    л.setAttribute('d', дуга(нx,нy,кx,кy));
    т.setAttribute('cx', кx.toFixed(1)); т.setAttribute('cy', кy.toFixed(1));
    т.setAttribute('r', 4.5);
    л.classList.toggle('глухой', глухой);
    т.classList.toggle('глухой', глухой);
    л.style.display = т.style.display = '';
    n++;
  }
  /* Лишние прячем, а не удаляем: удаление узла — это снова пересоздание при
     следующем показе, то есть снова прыжок анимации. */
  for (let k = n*2; k < путь.children.length; k++) путь.children[k].style.display = 'none';
}

/* ================= туман =================
   Слой собирается ОДИН РАЗ, а при изменении прогресса меняются только прогалы
   внутри маски. Раньше слой перерисовывался целиком — и вместе с разметкой
   пересоздавались клубы, из-за чего их анимация прыгала в начало: при открытии
   района дым будто заново приходил в движение. Именно это и было заметно.

   Слоёв два, и оба живут постоянно, с непрерывно ползущими клубами. Один
   показывает текущее состояние, второй ждёт с нулевой прозрачностью. Открытие
   района — это перекрёстное затухание между ними, после чего они меняются
   ролями. Так ни один дым нигде не перезапускается.

   Прогал — клякса с размытым краем. Через это пришлось пройти трижды: один
   эллипс с мягким сходом давал серый ОВАЛЬНЫЙ ореол, потому что муть кончалась
   по правильной кривой. Пять пятен вышли хуже — в маске они красят друг друга
   по порядку, и белый край одного стирает чёрное ядро соседнего. Объединить их
   mix-blend-mode:darken можно, но маску тогда пересчитывает каждый кадр, и
   страница встаёт. Работает третье: фигура сама неровная, а край ей даёт одно
   размытие; сплошной чёрный склеивается без всяких блендов. */

const дрожь = (i, k) => {
  const s = Math.sin(i*12.9898 + k*78.233) * 43758.5453;
  return s - Math.floor(s);                        /* 0..1, но всегда одно и то же */
};
function клякса(cx, cy, r, i){
  const n = 13;
  let d = '';
  for (let k = 0; k < n; k++){
    const a = k/n * Math.PI*2;
    const рад = r * (0.80 + 0.42*дрожь(i, k));
    const x = cx + Math.cos(a)*рад, y = cy + Math.sin(a)*рад*0.84;
    d += (k ? 'L' : 'M') + x.toFixed(0) + ' ' + y.toFixed(0) + ' ';
  }
  return '<path d="' + d + 'Z"/>';
}

/* Пелена — копия текстуры, растянутая шире карты. Шире нарочно: она ещё и
   ездит, и на краю не должно проступать её собственное чёрное поле. */
function пелена(W, H, мш, dx, dy, a){
  const ш = W*мш, в = ш;                           /* текстура квадратная */
  return '<image class="пелена" href="art/fog.webp" preserveAspectRatio="none"' +
    ' x="' + ((W-ш)/2 + W*dx).toFixed(0) + '" y="' + ((H-в)/2 + H*dy).toFixed(0) +
    '" width="' + ш.toFixed(0) + '" height="' + в.toFixed(0) + '" opacity="' + a + '"/>';
}

/* Каркас слоя: маска с пустой группой прогалов, тело и три ползущих пелены. */
function собратьТуман(цель){
  const W = карта.clientWidth, H = карта.clientHeight;
  const ид = цель.id;
  цель.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  /* id маски и фильтра — СВОИ у каждого слоя. Оба объявляли id="прогалы", а при
     одинаковых id ссылка находит первый по документу: копия прежнего тумана
     брала маску нового слоя и показывала уже расчищенный район. */
  цель.innerHTML =
    '<defs>' +
      '<filter id="мягкий-' + ид + '" x="-30%" y="-30%" width="160%" height="160%">' +
        '<feGaussianBlur stdDeviation="' + (W*0.055).toFixed(0) + '"/></filter>' +
      '<mask id="прогалы-' + ид + '" maskUnits="userSpaceOnUse" x="0" y="0" width="' + W + '" height="' + H + '">' +
        '<rect width="' + W + '" height="' + H + '" fill="#fff"/>' +
        '<g class="редкие" fill="#3a3a3a" filter="url(#мягкий-' + ид + ')"></g>' +
        '<g class="полные" fill="#000"    filter="url(#мягкий-' + ид + ')"></g>' +
      '</mask>' +
    '</defs>' +
    '<g mask="url(#прогалы-' + ид + ')">' +
      '<rect width="' + W + '" height="' + H + '" fill="#08080d" opacity=".97"/>' +
      '<g class="клубы1">' + пелена(W,H,1.5, -.06,  .12, .52) + '</g>' +
      '<g class="клубы2">' + пелена(W,H,1.15, .10,  .22, .36) + '</g>' +
      '<g class="клубы3">' + пелена(W,H,1.9,  .02, -.02, .24) + '</g>' +
    '</g>';
}

/* Только прогалы. Пелены не трогаются, поэтому их движение не рвётся. */
function обновитьПрогалы(цель, актов){
  const W = карта.clientWidth, H = карта.clientHeight;
  let полные = '', редкие = '';
  РАЙОНЫ.forEach((р, i) => {
    const с = состояниеПри(р, актов);
    if (с === 'туман') return;
    const м = место(р);
    const cx = м.x/100*W, cy = м.y/100*H;
    const r = м.ш.replace('%','')/100*W;
    /* Пройденное и открытое расчищаем совсем, а следующий район оставляем ПОД
       РЕДЕЮЩЕЙ мутью: он должен угадываться, а не открываться. */
    if (с === 'след') редкие += клякса(cx, cy, r*0.62, i);
    else              полные += клякса(cx, cy, r*1.22, i);
  });
  const п = цель.querySelector('.полные'), р = цель.querySelector('.редкие');
  if (п) п.innerHTML = полные;
  if (р) р.innerHTML = редкие;
}

/* ================= открытие района =================
   То, ради чего карта и нужна: игрок вернулся с последнего боя акта, и город
   при нём растёт. Сперва прочерчивается дорога — она ведёт взгляд туда, куда
   смотреть, — и в конце её сходит туман. Порядок важен: если гасить туман
   сразу, открытие происходит на периферии зрения и его можно не заметить. */
let идётОткрытие = false;
/* Метка показа. Уборка отложена на три секунды, и без метки таймер прошлого
   открытия успевал стереть слой уже НАЧАВШЕГОСЯ нового — копия исчезала, и
   рассеивания снова не было видно. Сброс тоже считается новым показом. */
let показ = 0;

async function сыгратьОткрытие(){
  if (идётОткрытие) return;
  const было = С.актов;
  if (было >= РАЙОНЫ.length) return;
  const след = РАЙОНЫ[было];                       /* тот, что откроется */
  if (ждатьСодержимое() && !есть(след)) return;
  идётОткрытие = true;
  const мой = ++показ;

  /* --- 1. трасса от пройденного района к новому --- */
  const W = карта.clientWidth, H = карта.clientHeight;
  const a = место(РАЙОНЫ[было-1]), b = место(след);
  const [нx,нy,кx,кy] = концы(a, b, W, H);
  трасса.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const тр = document.createElementNS('http://www.w3.org/2000/svg','path');
  тр.setAttribute('d', дуга(нx,нy,кx,кy));
  трасса.appendChild(тр);
  const L = тр.getTotalLength();
  тр.style.strokeDasharray = L;
  тр.style.strokeDashoffset = L;
  await тр.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
    {duration:820, easing:'cubic-bezier(.4,0,.3,1)', fill:'forwards'}).finished
    .catch(()=>{});

  /* --- 2. туман сходит --- */
  /* Прогалы нового состояния кладём в СПЯЩИЙ слой и показываем его под
     уходящим. Ни один слой не пересобирается, поэтому клубы у обоих
     продолжают ползти с того места, где были: раньше слой перерисовывался
     целиком, и дым при открытии заново приходил в движение. */
  const уходит = активный, приходит = спящий;
  обновитьПрогалы(приходит, было + 1);
  приходит.classList.add('виден');

  С.актов = было + 1;
  прР.value = С.актов;
  document.getElementById('пРайоныЗнач').textContent = С.актов + ' / ' + РАЙОНЫ.length;
  С.зачищено = 0; прЗ.value = 0;
  document.getElementById('пПрогрессЗнач').textContent = '0 / 10';

  /* Роли меняем сразу: отрисовка состояния должна идти уже в новый слой. */
  активный = приходит; спящий = уходит;
  нарисовать();

  /* Муть расходится ОТ нового района, а не от середины экрана. */
  const м2 = место(след);
  уходит.style.transformOrigin = м2.x + '% ' + м2.y + '%';
  уходит.classList.add('сходит');

  /* Новый район проявляется вместе с уходящим туманом. */
  const el = [...карта.querySelectorAll('.район')].find(n =>
    n.querySelector('.бирка') && n.querySelector('.бирка').textContent === 'АКТ ' + след.акт);
  if (el) el.classList.add('проявился');

  await new Promise(r => setTimeout(r, 3200));
  if (мой !== показ) return;                       /* показ уже сменился */
  /* Уходящий убираем в запас: метки снимаем, прогалы оставляем — их всё равно
     перепишут при следующем открытии. */
  уходит.classList.remove('сходит', 'виден');
  уходит.style.transformOrigin = '';
  /* Трассу не срезаем, а гасим: под ней уже лежит обычный пунктир, и резкая
     подмена читается как рывок. */
  await тр.animate([{opacity:.95},{opacity:0}], {duration:420, fill:'forwards'})
    .finished.catch(()=>{});
  тр.remove();
  идётОткрытие = false;
}

/* ================= панель ================= */
function открыть(р){
  выбран = р;
  document.getElementById('пАкт').textContent = 'АКТ ' + р.акт;
  document.getElementById('пИмя').textContent =
    р.акт === 1 ? 'ИЗ ГРЯЗИ В КАРТЫ!' : р.имя;
  const пройденАкт = р.акт < С.актов;
  const сделано = пройденАкт ? р.боёв : С.зачищено;
  document.getElementById('пСчёт').textContent =
    р.боёв + ' боёв · ' + сделано + '/' + р.боёв + ' зачищено';
  const список = document.getElementById('пСписок');
  список.innerHTML = '';
  for (let i = 0; i < р.боёв; i++){
    const имя = р.акт === 1 ? АКТ1[i].n : '— имя напишет автор —';
    const хп  = р.акт === 1 ? АКТ1[i].hp + ' хп' : '';
    const готов  = i < сделано;
    const сейчас = i === сделано && !пройденАкт;
    const заперт = i > сделано;
    const el = document.createElement('div');
    el.className = 'квест' + (готов?' готов':'') + (сейчас?' сейчас':'') + (заперт?' заперт':'');
    el.innerHTML =
      '<span class="ном">' + (i+1) + '</span>' +
      '<span class="имя">' + имя + '</span>' +
      '<span class="хп">' + хп + '</span>' +
      '<span class="тел">✆</span>' +
      '<button class="бой">' + (готов ? 'ЕЩЁ РАЗ' : 'В БОЙ') + '</button>';
    список.appendChild(el);
  }
  document.body.classList.add('открыт');
}
document.getElementById('пЗакр').onclick = () => document.body.classList.remove('открыт');

/* ================= пульт стенда ================= */
/* Два ползунка нарочно РАЗВЯЗАНЫ. Туман ходит по районам, а не по боям, и
   смотреть на него удобнее, дёргая районы напрямую. Зачистка внутри района на
   туман не влияет — только на список квестов справа. */
const прР = document.getElementById('пРайоны');
const прЗ = document.getElementById('пПрогресс');
const жд  = document.getElementById('пЖдать');

function обновить(){
  С.актов   = +прР.value;
  С.зачищено = +прЗ.value;
  document.getElementById('пРайоныЗнач').textContent = С.актов + ' / ' + РАЙОНЫ.length;
  document.getElementById('пПрогрессЗнач').textContent = С.зачищено + ' / 10';
  нарисовать();
  /* Открытая панель могла смотреть на район, который только что ушёл в туман. */
  if (выбран && состояние(выбран) === 'туман'){
    выбран = null; document.body.classList.remove('открыт');
  } else if (выбран) открыть(выбран);
}
прР.oninput = обновить;
прЗ.oninput = обновить;
жд.onchange = обновить;
document.getElementById('кОткрыть').onclick = сыгратьОткрытие;
document.getElementById('кСброс').onclick = () => {
  /* Сброс обязан вернуть и следы открытия: иначе следующий показ стартует с
     уже затухшим слоем и растворение не видно. */
  идётОткрытие = false; показ++;
  for (const с of [туман, туман2]){
    с.classList.remove('сходит', 'виден');
    с.style.transformOrigin = '';
  }
  активный = туман; спящий = туман2;
  туман.classList.add('виден');
  трасса.innerHTML = '';
  прР.value = 1; прЗ.value = 0; жд.checked = true;
  выбран = null; document.body.classList.remove('открыт');
  обновить();
};

/* Пересборка на изменение размера — единственный случай, когда слой можно
   перерисовать целиком: карта всё равно уже перестроилась. */
function собратьВсё(){
  собратьТуман(туман); собратьТуман(туман2);
  туман.classList.add('виден');
  нарисовать();
}
addEventListener('resize', () => {
  const был = активный;
  собратьТуман(туман); собратьТуман(туман2);
  был.classList.add('виден');
  нарисовать(); if (выбран) открыть(выбран);
});
собратьВсё();
</script>
